name: UAI Maintenance
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uai-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    if: github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint:fix
      - run: pnpm format
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Persist formatting and lockfile
        run: |
          git add -u
          git add -f pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalize repository formatting and lockfile"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
