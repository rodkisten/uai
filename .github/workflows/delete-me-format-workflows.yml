name: 🧹 DELETE ME · Format workflows
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/code-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.PLOOCKY_APP_ID }}
          private-key: ${{ secrets.PLOOCKY_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Commit and remove temporary workflow
        run: |
          git rm -f .github/workflows/delete-me-format-workflows.yml
          git add -u
          git config user.name "ploocky[bot]"
          git config user.email "ploocky[bot]@users.noreply.github.com"
          git commit -m "style: normalize remaining workflows [deploy]"
          git push origin HEAD:refs/heads/chore/code-quality
